<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="astra-title astra-desc" focusable="false">
  <title id="astra-title">Athene: arquitectura conceptual / conceptual architecture</title>
  <desc id="astra-desc">A generic fixed-wing VTOL observes a schematic forest through a forward underslung camera. A magnified computer detail is connected to a conceptual locator on the aircraft, indicating onboard inference without specifying component placement. Image and notice symbols travel from the aircraft to a local human review station. Three labels identify functions, not rigid mission steps. Original illustration; not approved Noctua geometry, actual thermal imagery or demonstrated performance. Aeronave genérica, ampliaciones y ubicación de componentes ilustrativas. Sin CAD ni resultados medidos.</desc>
