    <linearGradient id="astra-field" x1="150" y1="217" x2="150" y2="361" gradientUnits="userSpaceOnUse"><stop stop-color="#00e5ff" stop-opacity=".14"/><stop offset="1" stop-color="#00e5ff" stop-opacity=".02"/></linearGradient>
