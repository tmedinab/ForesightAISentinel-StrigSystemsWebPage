<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" fill="none" role="img" aria-labelledby="architecture-title architecture-description">
  <title id="architecture-title">Athene conceptual architecture in three-quarter perspective</title>
  <desc id="architecture-description">Three-quarter parallel projection of a generic fixed-wing VTOL aircraft with illustrative lift rotors and a camera below its forward fuselage. A locator identifies an enlarged onboard computer, with a separate directional camera-to-inference connection. A schematic forest terrain tile shows depth beneath the camera. Image and notice symbols reach a local human supervision console. Conceptual only: not approved Noctua geometry, real imagery, component placement, terrain data or measured performance. Use with the translated caption.</desc>
