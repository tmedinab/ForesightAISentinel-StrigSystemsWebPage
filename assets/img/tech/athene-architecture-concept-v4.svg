    <linearGradient id="aerial-surface" x1="70" y1="42" x2="402" y2="194" gradientUnits="userSpaceOnUse"><stop stop-color="#00e5ff" stop-opacity=".045"/><stop offset="1" stop-color="#00e5ff" stop-opacity=".012"/></linearGradient>
