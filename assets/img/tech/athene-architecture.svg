<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="astra-title astra-desc" focusable="false">
  <title id="astra-title">Athene: arquitectura conceptual / conceptual architecture</title>
  <desc id="astra-desc">A generic fixed-wing VTOL observes a schematic forest through a forward underslung camera. A magnified computer detail is connected to a conceptual locator on the aircraft, indicating onboard inference without specifying component placement. Arrows connect the camera to the enlarged onboard analysis detail and carry illustrative image/notice evidence to a local human review station; this is a logical explanation, not physical wiring. Amber thermal observation motifs repeat on the terrain and received evidence screen, awaiting human assessment; no tracked person or confirmed fire is asserted. Three labels identify functions, not rigid mission steps. Original illustration; not approved Noctua geometry, actual thermal imagery or demonstrated performance. Aeronave genérica, ampliaciones y ubicación de componentes ilustrativas. Indicio térmico esquemático pendiente de evaluación humana. Sin CAD ni resultados medidos.</desc>
  <defs>
    <linearGradient id="astra-field" x1="150" y1="217" x2="150" y2="361" gradientUnits="userSpaceOnUse"><stop stop-color="#00e5ff" stop-opacity=".14"/><stop offset="1" stop-color="#00e5ff" stop-opacity=".02"/></linearGradient>
    <marker id="astra-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 1 6 4-6 4" stroke="#00e5ff" stroke-width="1.8"/></marker>
    <!-- Shared lighting, vector surfaces only: no raster filters or external assets. -->
    <linearGradient id="airframe-top" x1="130" y1="85" x2="255" y2="207" gradientUnits="userSpaceOnUse"><stop stop-color="#b3c8d2"/><stop offset=".48" stop-color="#617f90"/><stop offset="1" stop-color="#304e60"/></linearGradient>
    <linearGradient id="airframe-side" x1="210" y1="145" x2="225" y2="203" gradientUnits="userSpaceOnUse"><stop stop-color="#416274"/><stop offset="1" stop-color="#162b39"/></linearGradient>
    <linearGradient id="terrain-surface" x1="160" y1="283" x2="239" y2="423" gradientUnits="userSpaceOnUse"><stop stop-color="#243d47"/><stop offset="1" stop-color="#101b26"/></linearGradient>
    <linearGradient id="instrument-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b3c8d2"/><stop offset=".5" stop-color="#4b687b"/><stop offset="1" stop-color="#1a3041"/></linearGradient>
    <radialGradient id="camera-shell" cx=".32" cy=".25" r=".8"><stop stop-color="#a2bac8"/><stop offset=".5" stop-color="#456779"/><stop offset="1" stop-color="#162d3d"/></radialGradient>
    <linearGradient id="console-face" x1="500" y1="245" x2="649" y2="345" gradientUnits="userSpaceOnUse"><stop stop-color="#314e60"/><stop offset="1" stop-color="#142733"/></linearGradient>
