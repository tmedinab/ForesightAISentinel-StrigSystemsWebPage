      <path d="M-12 1q3-7 10-6t11-1q7 3 4 8t-12 6q-11 0-13-7Z" fill="#f59e0b" fill-opacity=".12" stroke="#c08a32" stroke-opacity=".6" stroke-width="1"/>
      <path d="M-5 1q2-4 6-2t4 4q-1 3-6 2t-4-4Z" fill="#f4b54e" fill-opacity=".7"/>
      <path d="M-19-6v-7h7m24 0h7v7m0 13v7h-7m-24 0h-7V7" stroke="#f5b644" stroke-width="1.7"/>
    </g>
  </defs>
