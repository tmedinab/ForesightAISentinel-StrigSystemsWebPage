<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Ruta Fuera de Envolvente | Strig Systems</title>
  <meta name="description" content="Página no encontrada en la plataforma de Strig Systems.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=1.3.3">
  <!-- Umami Analytics (Privacy-First & Cookie-less) -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="aa979513-3790-4797-99e5-03d4a57d74ee"></script>
  <style>
    .error-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      position: relative;
      z-index: 1;
    }
    .error-card {
      max-width: 600px;
      width: 100%;
      text-align: center;
      padding: 3.5rem 2.5rem;
    }
    .error-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--accent-rose);
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .error-tag-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-rose);
      box-shadow: 0 0 6px var(--accent-rose);
    }
    .error-code {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(3.5rem, 8vw, 5.5rem);
      font-weight: 800;
      line-height: 1;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .error-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 1rem;
    }
    .error-desc {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="background-grid" aria-hidden="true"></div>
  <div class="glow-orb glow-top-left" aria-hidden="true"></div>

  <main class="error-wrapper">
    <div class="error-card glass-panel">
      <div class="error-tag">
        <span class="error-tag-dot" aria-hidden="true"></span>
        <span>Coordenadas fuera de envolvente</span>
      </div>
      <div class="error-code">404</div>
      <h1 class="error-title">Ruta o vector no localizado</h1>
      <p class="error-desc">
        La ruta solicitada no existe, ha sido reubicada o corresponde a un espacio aéreo no segregado. Puedes regresar al centro de mando principal o tomar contacto con el equipo técnico.
      </p>
      <div class="error-actions">
        <a href="/" class="btn-primary">
          <span>Volver al Centro de Mando</span>
          <span class="arrow-icon">→</span>
        </a>
        <a href="mailto:contacto@strigsystems.tech" class="btn-ghost">
          <span>Reportar a Mesa Técnica</span>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
